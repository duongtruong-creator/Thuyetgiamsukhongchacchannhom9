<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thuyết giảm sự không chắc chắn</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16;font-family:Arial,sans-serif}
.deck{position:relative;width:100vw;height:100vh}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;
transform:translateX(24px) scale(.985);transition:opacity .3s ease,transform .3s ease;
pointer-events:none;background:#050b16}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.topbar{position:fixed;z-index:20;left:0;right:0;top:0;height:52px;padding:0 14px;
display:flex;align-items:center;justify-content:space-between;color:white;
background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);font-size:13px}
.controls{display:flex;gap:7px;align-items:center}
.ctrl{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.38);color:#fff;
border-radius:7px;padding:7px 10px;cursor:pointer}
.ctrl:hover{background:rgba(255,255,255,.16)}
.progress{position:fixed;z-index:21;left:0;bottom:0;height:3px;background:#10dff5;width:0;transition:width .2s}
.help{position:fixed;z-index:19;left:50%;bottom:16px;transform:translateX(-50%);
color:rgba(255,255,255,.65);font-size:12px;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:14px}
.grid{position:fixed;z-index:30;inset:0;background:rgba(3,7,15,.97);display:none;overflow:auto;padding:58px 20px 25px}
.grid.open{display:block}
.grid-title{color:white;margin:0 0 16px;font-size:18px}
.grid-inner{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.thumb{background:#101827;border:1px solid #2a394d;border-radius:8px;padding:5px;color:white;cursor:pointer}
.thumb img{display:block;width:100%;height:auto;border-radius:5px}
.thumb span{display:block;padding:5px;text-align:center;font-size:12px}
.close{position:fixed;right:18px;top:12px;z-index:31}
@media(max-width:700px){.topbar{height:44px}.help{display:none}}
</style>
</head>
<body>
<div class="deck"><section class="slide"><img src="slide-01.png" alt="Slide 1"></section>
<section class="slide"><img src="slide-02.png" alt="Slide 2"></section>
<section class="slide"><img src="slide-03.png" alt="Slide 3"></section>
<section class="slide"><img src="slide-04.png" alt="Slide 4"></section>
<section class="slide"><img src="slide-05.png" alt="Slide 5"></section>
<section class="slide"><img src="slide-06.png" alt="Slide 6"></section>
<section class="slide"><img src="slide-07.png" alt="Slide 7"></section>
<section class="slide"><img src="slide-08.png" alt="Slide 8"></section>
<section class="slide"><img src="slide-09.png" alt="Slide 9"></section>
<section class="slide"><img src="slide-10.png" alt="Slide 10"></section>
<section class="slide"><img src="slide-11.png" alt="Slide 11"></section>
<section class="slide"><img src="slide-12.png" alt="Slide 12"></section>
<section class="slide"><img src="slide-13.png" alt="Slide 13"></section>
<section class="slide"><img src="slide-14.png" alt="Slide 14"></section>
<section class="slide"><img src="slide-15.png" alt="Slide 15"></section>
<section class="slide"><img src="slide-16.png" alt="Slide 16"></section>
<section class="slide"><img src="slide-17.png" alt="Slide 17"></section>
<section class="slide"><img src="slide-18.png" alt="Slide 18"></section>
<section class="slide"><img src="slide-19.png" alt="Slide 19"></section>
<section class="slide"><img src="slide-20.png" alt="Slide 20"></section>
<section class="slide"><img src="slide-21.png" alt="Slide 21"></section>
<section class="slide"><img src="slide-22.png" alt="Slide 22"></section></div>
<div class="topbar">
  <div>THUYẾT GIẢM SỰ KHÔNG CHẮC CHẮN</div>
  <div class="controls">
    <button class="ctrl" onclick="prev()">←</button>
    <span id="counter">01 / 22</span>
    <button class="ctrl" onclick="next()">→</button>
    <button class="ctrl" onclick="toggleFullscreen()">⛶</button>
    <button class="ctrl" onclick="toggleGrid()">☷</button>
  </div>
</div>
<div class="progress" id="progress"></div>
<div class="help">← → chuyển slide · Space tiếp · F toàn màn hình · O tổng quan · Esc đóng</div>
<div class="grid" id="grid">
  <button class="ctrl close" onclick="toggleGrid()">Đóng ✕</button>
  <h2 class="grid-title">Tổng quan 22 slide</h2>
  <div class="grid-inner"><button class="thumb" onclick="go(0)"><img src="slide-01.png" alt="Slide 1"><span>1</span></button>
<button class="thumb" onclick="go(1)"><img src="slide-02.png" alt="Slide 2"><span>2</span></button>
<button class="thumb" onclick="go(2)"><img src="slide-03.png" alt="Slide 3"><span>3</span></button>
<button class="thumb" onclick="go(3)"><img src="slide-04.png" alt="Slide 4"><span>4</span></button>
<button class="thumb" onclick="go(4)"><img src="slide-05.png" alt="Slide 5"><span>5</span></button>
<button class="thumb" onclick="go(5)"><img src="slide-06.png" alt="Slide 6"><span>6</span></button>
<button class="thumb" onclick="go(6)"><img src="slide-07.png" alt="Slide 7"><span>7</span></button>
<button class="thumb" onclick="go(7)"><img src="slide-08.png" alt="Slide 8"><span>8</span></button>
<button class="thumb" onclick="go(8)"><img src="slide-09.png" alt="Slide 9"><span>9</span></button>
<button class="thumb" onclick="go(9)"><img src="slide-10.png" alt="Slide 10"><span>10</span></button>
<button class="thumb" onclick="go(10)"><img src="slide-11.png" alt="Slide 11"><span>11</span></button>
<button class="thumb" onclick="go(11)"><img src="slide-12.png" alt="Slide 12"><span>12</span></button>
<button class="thumb" onclick="go(12)"><img src="slide-13.png" alt="Slide 13"><span>13</span></button>
<button class="thumb" onclick="go(13)"><img src="slide-14.png" alt="Slide 14"><span>14</span></button>
<button class="thumb" onclick="go(14)"><img src="slide-15.png" alt="Slide 15"><span>15</span></button>
<button class="thumb" onclick="go(15)"><img src="slide-16.png" alt="Slide 16"><span>16</span></button>
<button class="thumb" onclick="go(16)"><img src="slide-17.png" alt="Slide 17"><span>17</span></button>
<button class="thumb" onclick="go(17)"><img src="slide-18.png" alt="Slide 18"><span>18</span></button>
<button class="thumb" onclick="go(18)"><img src="slide-19.png" alt="Slide 19"><span>19</span></button>
<button class="thumb" onclick="go(19)"><img src="slide-20.png" alt="Slide 20"><span>20</span></button>
<button class="thumb" onclick="go(20)"><img src="slide-21.png" alt="Slide 21"><span>21</span></button>
<button class="thumb" onclick="go(21)"><img src="slide-22.png" alt="Slide 22"><span>22</span></button></div>
</div>
<script>
const slides=[...document.querySelectorAll('.slide')];
let current=0;
function show(n){
  current=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===current));
  document.getElementById('counter').textContent=
    String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';
}
function next(){show(current+1)} function prev(){show(current-1)}
function go(n){show(n);document.getElementById('grid').classList.remove('open')}
function toggleGrid(){document.getElementById('grid').classList.toggle('open')}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key.toLowerCase()==='f') toggleFullscreen();
  else if(e.key.toLowerCase()==='o') toggleGrid();
  else if(e.key==='Escape') document.getElementById('grid').classList.remove('open');
  else if(e.key==='Home') show(0);
  else if(e.key==='End') show(slides.length-1);
});
let sx=null;
document.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50) dx<0?next():prev();
  sx=null;
},{passive:true});
show(0);
</script>
</body>
</html>
